# Обновить ленту возможностей (олимпиады, конкурсы, летние программы) в рабочей базе.
# Применяет только supabase/data-opportunities.sql — вставка/обновление строк, схема не меняется.
# Запуск вручную: GitHub → Actions → «Обновить ленту возможностей» → Run workflow
# (или gh workflow run db-opportunities.yml --ref main). Использует тот же секрет SUPABASE_DB_URL, что и резервная копия.

name: Обновить ленту возможностей

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-opportunities
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Проверить секрет
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Нет секрета SUPABASE_DB_URL (см. docs/BACKUP.md)"
            exit 1
          fi

      - name: Применить данные
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/data-opportunities.sql
          psql "$SUPABASE_DB_URL" -tAc "select program_type, count(*) from public.opportunities group by 1 order by 1"
